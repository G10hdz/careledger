  <text x="84" y="124" font-size="17" fill="#b8c4c1">Registro offline &lt;60s · autocuidado · firma Ed25519</text>

  <path d="M280 144v36" stroke="#9aa8a5" stroke-width="2" marker-end="url(#aD)"/>
