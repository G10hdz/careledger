<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" font-family="system-ui,-apple-system,sans-serif">
  <text x="280" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#eff1f3">Ciclo de valor CareLedger</text>

