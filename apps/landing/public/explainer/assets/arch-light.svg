  <rect x="496" y="70" width="76" height="12" rx="2" fill="#FBF7F2"/><text x="534" y="79" fill="#C05A3E" font-size="8" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.06em">ATTESTACIÓN</text>

