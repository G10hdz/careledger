<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura EntreManos: cómo se conecta cada cosa</title>
  <desc id="d">La cuidadora registra en la PWA, el oráculo vecinal valida 3 de 3, el dominio emite Puntos Cívicos a la billetera; el vale QR se cobra en comercios y se liquida por SPEI; gobierno lee el ledger para SROI; el marketplace alimenta jornadas; el banco de tiempo comparte la atestación como economía separada.</desc>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A948B"/></marker>
    <marker id="ma" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2F6B5A"/></marker>
    <marker id="mt" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C05A3E"/></marker>
  </defs>
  <rect width="960" height="660" fill="#FBF7F2"/>
  <text x="48" y="40" fill="#8A948B" font-size="10" font-family="Inter, system-ui, sans-serif" letter-spacing="0.14em">ENTREMANOS · MAPA DE CONEXIONES</text>

  <!-- ===== conectores (primero, detrás de las cajas) ===== -->
  <!-- cuidadora -> pwa -->
  <path d="M176,92 H272" fill="none" stroke="#8A948B" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="196" y="70" width="56" height="12" rx="2" fill="#FBF7F2"/><text x="224" y="79" fill="#8A948B" font-size="8" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.06em">REGISTRA</text>
  <!-- pwa -> oráculo -->
  <path d="M360,120 V176" fill="none" stroke="#2F6B5A" stroke-width="1.5" marker-end="url(#ma)"/>
  <rect x="370" y="140" width="66" height="12" rx="2" fill="#FBF7F2"/><text x="403" y="149" fill="#8A948B" font-size="8" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.06em">FIRMA LOCAL</text>
  <!-- oráculo -> domain -->
  <path d="M360,232 V288" fill="none" stroke="#2F6B5A" stroke-width="1.5" marker-end="url(#ma)"/>
  <rect x="370" y="252" width="62" height="12" rx="2" fill="#FBF7F2"/><text x="401" y="261" fill="#8A948B" font-size="8" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.06em">3/3 EMITE</text>
  <!-- domain -> billetera -->
  <path d="M360,344 V404" fill="none" stroke="#2F6B5A" stroke-width="1.5" marker-end="url(#ma)"/>
  <rect x="370" y="366" width="46" height="12" rx="2" fill="#FBF7F2"/><text x="393" y="375" fill="#8A948B" font-size="8" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.06em">PUNTOS</text>
  <!-- billetera -> comercios -->
  <path d="M448,432 H568" fill="none" stroke="#2F6B5A" stroke-width="1.5" marker-end="url(#ma)"/>
  <rect x="482" y="410" width="52" height="12" rx="2" fill="#FBF7F2"/><text x="508" y="419" fill="#8A948B" font-size="8" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.06em">VALE QR</text>
  <!-- comercios -> spei -->
  <path d="M720,432 H776" fill="none" stroke="#8A948B" stroke-width="1.5" marker-end="url(#m)"/>
  <!-- familia -> billetera -->
  <path d="M176,428 H272" fill="none" stroke="#8A948B" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="194" y="406" width="60" height="12" rx="2" fill="#FBF7F2"/><text x="224" y="415" fill="#8A948B" font-size="8" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.06em">PROPINAS</text>
  <!-- servicios -> domain -->
  <path d="M644,232 V244 Q644,252 636,252 H428 Q420,252 420,260 V288" fill="none" stroke="#8A948B" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="500" y="230" width="68" height="12" rx="2" fill="#FBF7F2"/><text x="534" y="239" fill="#8A948B" font-size="8" font-family="Inter, system-ui, sans-serif" text-anchor="middle" letter-spacing="0.06em">JORNADA OK</text>
  <!-- domain -> gobierno -->
  <path d="M448,316 H568" fill="none" stroke="#8A948B" stroke-width="1.5" marker-end="url(#m)"/>
