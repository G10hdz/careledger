name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

      - name: Secretos (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact -v

  deploy:
    # Producción sale de aquí y no del auto-deploy de Vercel
    # (apps/landing/vercel.json lo apaga en main), así que no se publica
    # nada que no haya pasado checks. Los previews de PR siguen en Vercel.
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://entremanos-mx.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npx --yes vercel@65.10.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.10.0 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@65.10.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Smoke de producción
        run: |
          for path in / /cuidared; do
            code=$(curl -s -L -o /dev/null -w '%{http_code}' "https://entremanos-mx.vercel.app$path")
            echo "$path $code"
            test "$code" = 200
          done
